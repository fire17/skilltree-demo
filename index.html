<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עץ יכולות · מוקאפ</title>
<meta name="description" content="מוקאפ לחיץ: עץ יכולות כפרופיל של אדם בדוי, עם עדשת קהל לאדמין. נתונים בדויים בלבד.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --sheet:#FFFFFF; --ink:#1D1D1F; --mute:#6E6E73; --line:#E5E5EA; --fill:#F2F2F7;
  --blue:#007AFF; --green:#34C759; --amber:#FF9500; --amber-soft:#FFF4E5; --red:#FF3B30; --indigo:#5856D6; --gray:#8E8E93;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.07);
  --glass:rgba(255,255,255,.72);
  --space:#0B0B10; --space2:#17171F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --sheet:#1C1C1E; --ink:#F5F5F7; --mute:#98989D; --line:#38383A; --fill:#2C2C2E;
    --blue:#0A84FF; --green:#30D158; --amber:#FF9F0A; --amber-soft:#3A2A12; --red:#FF453A; --indigo:#5E5CE6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); --glass:rgba(28,28,30,.72);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --sheet:#1C1C1E; --ink:#F5F5F7; --mute:#98989D; --line:#38383A; --fill:#2C2C2E;
  --blue:#0A84FF; --green:#30D158; --amber:#FF9F0A; --amber-soft:#3A2A12; --red:#FF453A; --indigo:#5E5CE6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); --glass:rgba(28,28,30,.72);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",system-ui,sans-serif;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px;border-radius:10px}
.i{width:1em;height:1em;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(16px,calc((100% - 1240px)/2 + 20px)) 12px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.who{display:flex;align-items:center;gap:12px;flex:1 1 260px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,#5AC8FA,#0A84FF);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}
.who h1{margin:0;font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.who p{margin:2px 0 0;color:var(--mute);font-size:14px}
.lens{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:10px;padding:2px}
.lens button{border:0;background:none;padding:6px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.lens button[aria-pressed="true"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.fake{font-size:12px;color:var(--mute)}

.stage{max-width:1240px;margin:0 auto;padding:20px 16px 32px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.canvas{position:relative;border-radius:28px;overflow:hidden;color:#F5F5F7;background:radial-gradient(120% 90% at 50% 45%,var(--space2) 0%,var(--space) 62%);box-shadow:0 20px 60px rgba(0,0,0,.18)}
svg#tree{display:block;width:100%;height:auto;touch-action:manipulation}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:18px 20px 0}
.bar b{font-weight:600;font-size:14px;color:rgba(255,255,255,.6);margin-inline-end:4px}
.chip{border:0;background:rgba(255,255,255,.08);color:#F5F5F7;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip:hover{background:rgba(255,255,255,.16)}
.chip[disabled]{opacity:.35;cursor:default}
.next{display:flex;align-items:center;gap:12px;margin:14px 20px 0;padding:12px 16px;border-radius:16px;background:rgba(255,159,10,.12);box-shadow:inset 0 0 0 .5px rgba(255,159,10,.4)}
.next[hidden]{display:none}
.next p{margin:0;flex:1;font-size:15px}
.next strong{color:#FFB340}
.next .btn{background:#FF9F0A;color:#000;padding:7px 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:4px 20px 18px;font-size:12.5px;color:rgba(255,255,255,.55)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.panel{position:sticky;top:96px;background:var(--sheet);border-radius:28px;box-shadow:var(--shadow);padding:24px;min-height:300px}
.panel h2{margin:0 0 4px;font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;font-size:20px}
.panel .sub{color:var(--mute);font-size:15px;margin:0 0 14px}
.state{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px}
.st-unlocked{background:color-mix(in srgb,var(--green) 14%,transparent);color:#248A3D}
.st-mastered{background:color-mix(in srgb,#FFB800 18%,transparent);color:#B07D00}
.st-suggested{background:var(--amber-soft);color:var(--amber)}
.st-locked{background:var(--fill);color:var(--mute)}
.st-hidden{background:color-mix(in srgb,var(--indigo) 12%,transparent);color:var(--indigo)}
.st-guard{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}
.panel h3{font-size:13px;margin:18px 0 6px;color:var(--mute);font-weight:600}
.panel ul{margin:0;padding-inline-start:18px}
.panel li{margin:3px 0}
.conf{height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.conf i{display:block;height:100%;border-radius:3px}
.why{background:var(--fill);border-radius:14px;padding:12px 14px;font-size:15px;margin-top:6px}
.apps{display:flex;flex-wrap:wrap;gap:8px}
.app{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:14px;padding:8px 12px 8px 12px;font-size:14px;font-weight:500}
.app .tile{width:24px;height:24px;border-radius:7px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:600;border-radius:14px;padding:7px 14px;color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{border:0;background:var(--fill);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px;color:var(--blue);transition:transform .15s,filter .15s}
.btn.primary{background:var(--blue);color:#fff}
.btn.warn{color:var(--red)}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.empty{color:var(--mute)}
.stats{display:flex;gap:10px;margin:4px 0 12px}
.stat{flex:1;background:var(--fill);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}

.rank{margin:8px 0 0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:9px 4px;border-bottom:.5px solid var(--line);cursor:pointer;border-radius:8px}
.rank li:hover{background:var(--fill)}
.rank .tile{width:26px;height:26px;border-radius:8px;font-size:15px}
.rank .meter{grid-column:2/-1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.rank .meter i{display:block;height:100%;border-radius:2px}
.rank small{color:var(--mute);font-variant-numeric:tabular-nums}
.proposal{border-radius:20px;padding:16px;margin-top:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--indigo) 10%,var(--sheet)),color-mix(in srgb,var(--blue) 8%,var(--sheet)))}
.proposal h4{margin:0 0 6px;font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center}
.proposal p{margin:4px 0;font-size:14px}
.kanon{font-size:13px;color:var(--mute);margin-top:12px}
.perm{list-style:none;margin:6px 0 0;padding:0}
.perm li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:15px}
.perm small{color:var(--mute)}
.perm .lab{display:flex;align-items:center;gap:10px}
.perm .tile{width:26px;height:26px;border-radius:8px;font-size:15px}
.tog{position:relative;width:51px;height:31px;border:0;border-radius:999px;background:var(--fill);cursor:pointer;flex:none;font-size:0;transition:background .25s}
.tog::after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:inset-inline-end .25s}
.tog[aria-pressed="true"]{background:var(--green)}
.tog[aria-pressed="true"]::after{inset-inline-end:22px}
.tog[disabled]{width:auto;height:auto;font-size:12px;font-weight:600;padding:4px 10px;background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);cursor:default}
.tog[disabled]::after{display:none}

/* svg */
.orbit{fill:none;stroke:rgba(255,255,255,.06);stroke-width:1}
.edge{fill:none;stroke-linecap:round}
.flow{fill:none;stroke:rgba(255,255,255,.55);stroke-linecap:round;stroke-dasharray:1.5 22;animation:flow 3.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-47}}
.node{cursor:pointer;outline:none}
.node .lbl{font-size:16px;font-weight:600;fill:rgba(255,255,255,.92);letter-spacing:-.01em;paint-order:stroke;stroke:#0E0E14;stroke-width:5px;stroke-linejoin:round}
.node .cnt{font-size:13px;font-weight:600;fill:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#0E0E14;stroke-width:5px;stroke-linejoin:round}
.node.dim .lbl{fill:rgba(255,255,255,.42)}
.node .hit{fill:transparent}
.node .ic{fill:none;stroke-linecap:round;stroke-linejoin:round}
.node:focus-visible .core,.node.sel .core{stroke:#fff;stroke-width:2.5}
.node:hover .core{filter:brightness(1.12)}
.spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.breathe{animation:breathe 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.8}}
.burst{animation:burst 1s cubic-bezier(.2,.8,.2,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes burst{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(3)}}
.root text{font-size:12.5px;font-weight:500;fill:rgba(255,255,255,.55)}

.toast{visibility:hidden;position:fixed;inset-inline:0;bottom:24px;margin:auto;width:min(520px,calc(100% - 32px));background:rgba(29,29,31,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;border-radius:18px;padding:13px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-size:15px;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:20}
.toast.on{transform:none;visibility:visible}
.toast b{color:#FFB340}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;padding:16px 12px 32px}
  .panel{position:relative;top:0}
  .who h1{font-size:24px}
}
@media (max-width:600px){
  .node .lbl{font-size:29px;stroke-width:8px}
  .node .cnt{font-size:23px;stroke-width:8px}
  .root text{font-size:19px}
  .bar{padding:14px 14px 0}
  .next{margin:12px 14px 0}
}
@media (prefers-reduced-motion:reduce){
  .flow,.spin,.breathe,.burst{animation:none}
  .toast,.tog,.tog::after{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="who">
    <div class="avatar" aria-hidden="true">נ</div>
    <div>
      <h1 id="title">העץ של נועה</h1>
      <p id="subtitle">34 · תל אביב · נרשמה לפני 5 חודשים</p>
    </div>
  </div>
  <div class="lens" role="group" aria-label="עדשה">
    <button id="lensMe" aria-pressed="true">העץ שלי</button>
    <button id="lensCrowd" aria-pressed="false">עדשת הקהל (אדמין)</button>
  </div>
  <span class="fake">אדם בדוי, נתונים בדויים</span>
</header>

<main class="stage">
  <section class="canvas" aria-label="עץ היכולות">
    <div class="bar" id="events"><b>מה קרה השבוע?</b></div>
    <div class="next" id="next" hidden></div>
    <svg id="tree" viewBox="60 70 880 880" role="img" aria-label="עץ רדיאלי: במרכז האדם, סביבו ענפים לפי תחומי חיים"></svg>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>
<div class="toast" id="toast" role="status"></div>

  svg.setAttribute('viewBox',M>1?'95 105 810 810':'60 70 880 880');
  const crowd=lens==='crowd';
  const defs=el('defs',{},svg);
  const glow=el('filter',{id:'glow',x:'-80%',y:'-80%',width:'260%',height:'260%'},defs);
  el('feGaussianBlur',{stdDeviation:'9',result:'b'},glow);
  const mg=el('feMerge',{},glow); el('feMergeNode',{in:'b'},mg); el('feMergeNode',{in:'SourceGraphic'},mg);
  const soft=el('filter',{id:'soft',x:'-100%',y:'-100%',width:'300%',height:'300%'},defs);
  el('feGaussianBlur',{stdDeviation:'16'},soft);

  [R1,R2,120].forEach(r=>el('circle',{cx:CX,cy:CY,r,class:'orbit'},svg));

  // edges
  let gi=0;
  for(const [id,n] of Object.entries(N)){
    if(!shown(id)) continue;
    const p=n.parent?N[n.parent]:null;
    const a=LIMBS[n.limb].a*Math.PI/180;
    const x1=p?p.x:CX+92*Math.sin(a), y1=p?p.y:CY-92*Math.cos(a);
    const d=curve(x1,y1,n.x,n.y,p?(n.off>0?-.12:n.off<0?.12:0):.08);
    const gid='g'+(gi++);
    const lg=el('linearGradient',{id:gid,gradientUnits:'userSpaceOnUse',x1,y1,x2:n.x,y2:n.y},defs);
    let w, op, dash='none', col=n.hue;
    if(crowd){
      col=n.crowd==null?'#8E8E93':heat(n.crowd);
      w=n.crowd==null?1.2:Math.max(1.5,Math.min(14,(n.crowd/USERS)*40)); op=n.crowd!=null&&n.crowd<K?.35:.95;
      if(n.crowd==null) dash='2 7';
    } else {
      const on=lit(n)||n.state==='suggested';
      w=on?(n.d===1?3.2:2.2):1.3; op=on?.95:.4;
      if(!on) dash='2 7'; if(n.state==='guard') col='#8E8E93';
    }
    el('stop',{offset:'0%','stop-color':p?(crowd&&p.crowd!=null?heat(p.crowd):p.hue):'#FFFFFF','stop-opacity':p?op:.12},lg);
    el('stop',{offset:'100%','stop-color':col,'stop-opacity':op},lg);
    el('path',{d,class:'edge',stroke:`url(#${gid})`,'stroke-width':w,'stroke-dasharray':dash},svg);
    if(!crowd && lit(n)) el('path',{d,class:'flow','stroke-width':Math.max(1.6,w-.6)},svg);
  }

  // center
  const total=Object.keys(N).filter(k=>N[k].state!=='guard').length;
  const opened=Object.values(N).filter(lit).length;
  el('circle',{cx:CX,cy:CY,r:120,fill:'url(#none)',class:'orbit'},svg);
  el('circle',{cx:CX,cy:CY,r:70,fill:crowd?'#FF6B2C':'#0A84FF',opacity:.35,filter:'url(#soft)'},svg);
  const cg=el('g',{},svg);
  const cgrad=el('linearGradient',{id:'cgrad',x1:0,y1:0,x2:0,y2:1},defs);
  el('stop',{offset:'0%','stop-color':crowd?'#FF9F0A':'#5AC8FA'},cgrad); el('stop',{offset:'100%','stop-color':crowd?'#FF453A':'#0A84FF'},cgrad);
  el('circle',{cx:CX,cy:CY,r:56,fill:'url(#cgrad)'},cg);
  const ringR=72, C=2*Math.PI*ringR, frac=crowd?1:opened/total;
  el('circle',{cx:CX,cy:CY,r:ringR,fill:'none',stroke:'rgba(255,255,255,.1)','stroke-width':6},cg);
  el('circle',{cx:CX,cy:CY,r:ringR,fill:'none',stroke:crowd?'#FF9F0A':'#30D158','stroke-width':6,'stroke-linecap':'round','stroke-dasharray':`${(C*frac).toFixed(1)} ${C.toFixed(1)}`,transform:`rotate(-90 ${CX} ${CY})`},cg);
  const ct=el('text',{x:CX,y:crowd?CY+8:CY+14,'text-anchor':'middle','font-size':crowd?26:40,'font-weight':700,fill:'#fff'},cg);
  ct.textContent=crowd?USERS.toLocaleString('he-IL'):'נ';
  if(crowd){ const s=el('text',{x:CX,y:CY+30,'text-anchor':'middle','font-size':13,'font-weight':500,fill:'rgba(255,255,255,.75)'},cg); s.textContent='משתמשים'; }

  // roots on the inner ring
  if(!crowd) ROOTS.forEach(([t,a])=>{
    const r=a*Math.PI/180, x=CX+120*Math.sin(r), y=CY-120*Math.cos(r);
    const g=el('g',{class:'root'},svg);
    el('circle',{cx:x,cy:y,r:3.5,fill:'rgba(255,255,255,.55)'},g);
    const tx=el('text',{x,y:y+(Math.cos(r)>0?-11:22),'text-anchor':'middle'},g); tx.textContent=t;
  });

  // nodes
  for(const [id,n] of Object.entries(N)){
    if(!shown(id)) continue;
    const dim=!crowd&&(n.state==='locked'||n.state==='hidden');
    const g=el('g',{class:'node'+(dim?' dim':'')+(sel===id?' sel':''),tabindex:0,role:'button','aria-label':n.name+', '+(crowd?(n.crowd==null?'לא נאסף':fmt(n.crowd)):STATE_TXT[n.state])},svg);
    g.addEventListener('click',()=>select(id));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id)}});
    let r=(n.d===1?30:24)*M, fill, stroke='none', icol='#fff', ic=n.ic, halo=null;
    if(crowd){
      const c=n.crowd;
      if(c==null){ fill='rgba(142,142,147,.14)'; stroke='#8E8E93'; icol='#8E8E93'; }
      else if(c<K){ fill='rgba(255,255,255,.04)'; stroke='rgba(255,255,255,.3)'; icol='rgba(255,255,255,.5)'; }
      else { r=18+Math.sqrt(c/USERS)*34; fill=heat(c); halo=heat(c); icol='#1D1D1F'; }
    } else if(lit(n)){ fill=n.hue; halo=n.hue; }
    else if(n.state==='suggested'){ fill=n.hue+'22'; stroke=n.hue; icol=n.hue; }
    else if(n.state==='guard'){ fill='rgba(142,142,147,.14)'; stroke='#8E8E93'; icol='#AEAEB2'; }
    else if(n.state==='hidden'){ fill='rgba(255,255,255,.03)'; stroke='rgba(255,255,255,.28)'; icol='rgba(255,255,255,.45)'; ic='eye-off'; }
    else { fill='rgba(255,255,255,.04)'; stroke='rgba(255,255,255,.2)'; icol='rgba(255,255,255,.4)'; ic='lock'; }

    el('circle',{cx:n.x,cy:n.y,r:r+18,class:'hit'},g);
    if(halo) el('circle',{cx:n.x,cy:n.y,r:r*.9,fill:halo,opacity:.55,filter:'url(#soft)'},g);
    if(n.justRevealed) el('circle',{cx:n.x,cy:n.y,r:r+4,fill:'none',stroke:n.hue,'stroke-width':3,class:'burst'},g);
    if(!crowd&&n.state==='suggested'){
      el('circle',{cx:n.x,cy:n.y,r:r+9,fill:'none',stroke:n.hue,'stroke-width':1.5,'stroke-dasharray':'3 6',class:'spin'},g);
      el('circle',{cx:n.x,cy:n.y,r:r+4,fill:n.hue,opacity:.25,filter:'url(#soft)',class:'breathe'},g);
    }
    if(!crowd&&n.state==='mastered') el('circle',{cx:n.x,cy:n.y,r:r+7,fill:'none',stroke:'#FFD60A','stroke-width':2},g);
    const core=el('circle',{cx:n.x,cy:n.y,r,fill,stroke,'stroke-width':stroke==='none'?0:1.6,class:'core','stroke-dasharray':(!crowd&&n.state==='hidden')||(crowd&&n.crowd!=null&&n.crowd<K)?'3 4':'none'},g);
    const s=(n.d===1?24:20)*M/24, isz=24*s;
    const ig=el('g',{transform:`translate(${(n.x-isz/2).toFixed(1)} ${(n.y-isz/2).toFixed(1)}) scale(${s})`,class:'ic',stroke:icol,'stroke-width':2},g);
    ig.innerHTML=ICONS[ic]||'';
    if(!crowd&&n.state==='suggested') el('circle',{cx:n.x+r*.74,cy:n.y-r*.74,r:5.5,fill:'#FFB340',stroke:'#0B0B10','stroke-width':2.5},g);
    const ly=n.y+r+(crowd?22:24)*M;
    el('text',{x:n.x,y:ly,'text-anchor':'middle',class:'lbl'},g).textContent=n.name;
    if(crowd) el('text',{x:n.x,y:ly+18*M,'text-anchor':'middle',class:'cnt'},g).textContent=n.crowd==null?'לא נאסף':fmt(n.crowd);
  }
  for(const n of Object.values(N)) n.justRevealed=false;
  legend();
}

function legend(){
  const L=document.getElementById('legend');
  L.innerHTML = lens==='crowd'
    ? `${HEAT.map((h,i)=>`<span><i class="dot" style="background:${h}"></i>${['עד 5%','5% עד 15%','15% עד 35%','מעל 35%'][i]}</span>`).join('')}<span><i class="dot" style="border:1.5px dashed rgba(255,255,255,.4)"></i>פחות מ־${K}: מוסתר</span><span>גודל ועובי = כמה אנשים אישרו</span>`
    : `<span><i class="dot" style="background:#30D158"></i>פתוח</span><span><i class="dot" style="border:1.5px solid #FF9F0A;background:rgba(255,159,10,.15)"></i>מוצע, ממתין לאישור</span><span><i class="dot" style="border:1.5px solid rgba(255,255,255,.3)"></i>נעול</span><span><i class="dot" style="border:1.5px dashed rgba(255,255,255,.35)"></i>מוסתר</span><span><i class="dot" style="border:1.5px solid #8E8E93"></i>מוגן</span><span>במרכז: את. על הטבעת: מה שסיפרת בהרשמה</span>`;
}

// ---------- panel ----------
function select(id){
  sel=id; draw(); lens==='crowd'?crowdPanel(id):mePanel(id);
  if(id&&matchMedia('(max-width:900px)').matches) panel.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
}
function mePanel(id){
  const n=N[id];
  if(!n){ panel.innerHTML=intro(); bindPerm(); return; }
  let h=`<span class="state st-${n.state}">${STATE_TXT[n.state]}</span><h2>${tile(n)} ${n.name}</h2><p class="sub">${LIMBS[n.limb].name} · ${SRC_TXT[n.src]}</p>`;
  if(n.conf!=null && n.state!=='locked'){
    const pc=Math.round(n.conf*100);
    h+=`<h3>כמה אנחנו בטוחים · ${pc}%</h3><div class="conf" role="meter" aria-valuenow="${pc}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pc}%;background:${n.state==='suggested'?'var(--amber)':'var(--green)'}"></i></div>`;
  }
  if(n.ev && n.state!=='locked') h+=`<h3>על מה זה מבוסס</h3><ul>${n.ev.map(e=>`<li>${e}</li>`).join('')}</ul>`;
  if(n.why) h+=`<h3>למה אני רואה את זה</h3><div class="why">${n.why}</div>`;
  if(n.hint && n.state==='locked') h+=`<h3>מה פותח את זה</h3><div class="why">${n.hint}</div>`;
  if(n.badge && lit(n)) h+=`<h3>תג</h3><span class="badge" style="background:linear-gradient(160deg,${n.hue}DD,${n.hue});box-shadow:0 6px 16px ${n.hue}55">${icon(n.ic)} ${n.badge}</span>`;
  if(n.apps && n.state!=='guard') h+=`<h3>${lit(n)?'פתוח בשבילך':'ייפתח אם תאשרי'}</h3><div class="apps">${n.apps.map(a=>`<span class="app">${tile(n)}${a}</span>`).join('')}</div>`;
  h+=`<div class="actions">`;
  if(n.state==='suggested') h+=`<button class="btn primary" data-a="yes">כן, זו אני</button><button class="btn" data-a="no">לא נכון</button><button class="btn" data-a="later">לא עכשיו</button>`;
  if(lit(n)) h+=`<button class="btn" data-a="hide">הסתירי מהפרופיל</button><button class="btn warn" data-a="forget">מחקי את הראיות</button>`;
  if(n.state==='hidden') h+=`<button class="btn" data-a="show">החזירי לפרופיל</button><button class="btn warn" data-a="forget">מחקי את הראיות</button>`;
  if(n.state==='guard') h+=`<button class="btn" data-a="tell">לספר בעצמי (אופציונלי)</button>`;
  h+=`</div>`;
  panel.innerHTML=h;
  panel.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>act(id,b.dataset.a)));
}
function act(id,a){
  const n=N[id];
  if(a==='yes'){ n.state='unlocked'; n.src='confirmed'; n.justRevealed=true; toast(`<b>${n.name}</b> נפתח. ${n.apps?'נפתחו '+n.apps.length+' מיני־אפים.':''}`); }
  if(a==='no'){ n.state='locked'; n.ev=null; n.why=null; n.conf=null; n.hint='סימנת שזה לא נכון. לא נציע את זה שוב.'; toast('הוסר. לא נציע את זה שוב.'); }
  if(a==='later'){ toast('בסדר. נשאל שוב רק בסיכום השבועי.'); select(null); nextCard(); return; }
  if(a==='hide'){ n.state='hidden'; n.why='הסתרת את הענף הזה. הוא נשאר רק אצלך ולא משמש להצעות.'; toast('הוסתר. רק את רואה אותו.'); }
  if(a==='show'){ n.state='unlocked'; n.justRevealed=true; toast('חזר לפרופיל.'); }
  if(a==='forget'){ n.state='locked'; n.ev=null; n.conf=null; n.why=null; n.hint='הראיות נמחקו. הענף ייפתח רק אם תחזרי לזה.'; toast('הראיות נמחקו.'); }
  if(a==='tell'){ toast('במוצר האמיתי: טופס קצר, הסכמה מפורשת, ומחיקה בלחיצה. כאן זה רק מוקאפ.'); return; }
  select(id); nextCard();
}
function intro(){
  const open=Object.values(N).filter(lit).length;
  const sug=Object.keys(N).filter(k=>N[k].state==='suggested'&&shown(k)).length;
  return `<h2>העץ שלך גדל ממה שאת עושה</h2><p class="sub">בהרשמה ידענו רק גיל, מין ועיר. כל השאר צמח מהשימוש.</p>
  <div class="stats"><div class="stat"><b>${open}</b><span>ענפים פתוחים</span></div><div class="stat"><b style="color:var(--amber)">${sug}</b><span>מחכים לאישור</span></div></div>
  <div class="why">שום דבר לא נכנס לפרופיל בלי שתאשרי. כל עלה מראה על מה הוא מבוסס, ואפשר להסתיר או למחוק אותו.</div>
  <h3>מה מותר למערכת ללמוד עלייך</h3><ul class="perm">${PERM.map(p=>{ const L=LIMBS[p.k]||{hue:p.hue||'#8E8E93'}; const ic=p.ic||(Object.values(N).find(n=>n.limb===p.k&&n.d===1)||{}).ic||'lock';
    return `<li><span class="lab">${tile({hue:L.hue,ic})}<span>${p.name}${p.fixed?`<br><small>${p.fixed}</small>`:''}</span></span>${p.fixed?`<button class="tog" disabled>${p.k==='health'?'חסום':'הצהרה'}</button>`:`<button class="tog" data-p="${p.k}" aria-pressed="${p.on}" aria-label="${p.name}">${p.on?'מותר':'כבוי'}</button>`}</li>`; }).join('')}</ul>
  <p class="empty" style="margin-top:14px">לחצי על עיגול כתום כדי לראות מה זיהינו, או נסי אירוע.</p>`;
}
function bindPerm(){ panel.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{ const p=PERM.find(x=>x.k===b.dataset.p); p.on=!p.on; toast(p.on?`<b>${p.name}</b>: מותר ללמוד. הצעות יופיעו לאישור שלך.`:`<b>${p.name}</b>: כבוי. ההצעות בתחום הוסרו ולא ייאספו.`); draw(); panel.innerHTML=intro(); bindPerm(); nextCard(); })); }
function nextCard(){
  const box=document.getElementById('next');
  const id=lens==='me'&&Object.keys(N).find(k=>N[k].state==='suggested'&&shown(k));
  if(!id){ box.hidden=true; return; }
  const n=N[id]; box.hidden=false;
  box.innerHTML=`<p><strong>הצעד הבא</strong> · נראה לנו ש${n.q||n.name}. נכון?</p><button class="btn" id="nx">לבדוק</button>`;
  document.getElementById('nx').onclick=()=>select(id);
}

// ---------- crowd lens ----------
const signal=n=>Math.round(Math.min(100,(((n.crowd||0)/USERS)*120+(n.growth||0)*.9)*(n.weight||1)));
function crowdPanel(id){
  const list=Object.keys(N).filter(k=>N[k].crowd!=null&&shown(k)).map(k=>({k,n:N[k],s:signal(N[k])})).sort((a,b)=>b.s-a.s);
  const top=list.filter(x=>x.n.crowd>=100)[0], max=list[0].s||1;
  let h=`<h2>איפה העץ נדלק</h2><p class="sub">${USERS.toLocaleString('he-IL')} משתמשים בדויים. נספרים רק ענפים שאנשים אישרו, ורק כסכומים.</p>`;
  if(id&&N[id]){ const n=N[id];
    h+=`<div class="why"><strong>${n.name}</strong><br>${n.crowd==null?'קטגוריה מוגנת. לא אוספים ולא סופרים.':n.crowd<K?`פחות מ־${K} אנשים. לא מציגים מספר, כדי שאי אפשר יהיה לזהות אף אחד.`:`${fmt(n.crowd)} אנשים · צמיחה ${n.growth}% ברבעון · ציון ${signal(n)}`}</div>`; }
  h+=`<h3>ענפים לפי ציון ביקוש</h3><ul class="rank">`;
  for(const x of list.slice(0,7)){
    const hid=x.n.crowd<K;
    h+=`<li data-k="${x.k}">${tile(x.n)}<span>${x.n.name}</span><small>${hid?'מוסתר':x.s}</small><span class="meter"><i style="width:${hid?0:x.s/max*100}%;background:${heat(x.n.crowd)}"></i></span></li>`;
  }
  h+=`</ul>`;
  if(top) h+=`<div class="proposal"><h4>${icon('sparkles')} הצעה לסוכן: ${top.n.name}</h4>
    <p>${fmt(top.n.crowd)} אנשים, צמיחה ${top.n.growth}% ברבעון. יש רק ${top.n.apps?top.n.apps.length:0} מיני־אפים בענף: ביקוש בלי היצע.</p>
    <p>סוכן יבנה טיוטה של מיני־אפ לענף, בתקציב מוגבל. שום דבר לא עולה לאוויר בלי אישור של אדמין.</p>
    <div class="actions"><button class="btn primary" id="approve">אשר לסוכן לבנות טיוטה</button></div></div>`;
  h+=`<p class="kanon">ענף עם פחות מ־${K} אנשים לא מוצג במספרים. סוכן מוצע רק מעל 100. קטגוריות רגישות לא נאספות בכלל.</p>`;
  panel.innerHTML=h;
  panel.querySelectorAll('.rank li').forEach(li=>li.addEventListener('click',()=>select(li.dataset.k)));
  const ap=document.getElementById('approve'); if(ap) ap.addEventListener('click',()=>toast(`במוקאפ: הסוכן היה מתחיל טיוטה ל־<b>${top.n.name}</b> ומחזיר אותה לאישור. בפועל לא קורה כלום.`));
}

// ---------- events ----------
function reveal(id,msg){ const n=N[id]; if(permOff(id)){ toast('הקטגוריה כבויה אצלה. לא לומדים מזה.'); return; } n.revealed=true; n.state='suggested'; n.justRevealed=true; toast(msg); select(id); nextCard(); }
const evBox=document.getElementById('events');
for(const e of EVENTS){ const b=document.createElement('button'); b.className='chip'; b.textContent=e.label; b.addEventListener('click',()=>{ if(lens!=='me') setLens('me'); e.run(); b.disabled=true; }); evBox.appendChild(b); }
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(draw,150)});
let tt; function toast(h){ const t=document.getElementById('toast'); t.innerHTML=h; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),4200); }

function setLens(l){
  lens=l;
  document.getElementById('lensMe').setAttribute('aria-pressed',l==='me');
  document.getElementById('lensCrowd').setAttribute('aria-pressed',l==='crowd');
  document.getElementById('title').textContent=l==='me'?'העץ של נועה':'העץ של כולם';
  document.getElementById('subtitle').textContent=l==='me'?'34 · תל אביב · נרשמה לפני 5 חודשים':'אותו עץ, דרך עיני האדמין';
  sel=null; draw(); l==='me'?(panel.innerHTML=intro(),bindPerm()):crowdPanel(null); nextCard();
}
document.getElementById('lensMe').addEventListener('click',()=>setLens('me'));
document.getElementById('lensCrowd').addEventListener('click',()=>setLens('crowd'));
const q=new URLSearchParams(location.search);
setLens(q.get('lens')==='crowd'?'crowd':'me');
if(q.get('sel')) select(q.get('sel'));
</script>
</body>
