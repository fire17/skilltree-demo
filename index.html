<style>
:root{
  --bg:#F5F5F7; --paper:#FFFFFF; --ink:#1D1D1F; --mute:#6E6E73; --line:#E5E5EA; --fill:#F2F2F7;
  --bark:#D1D1D6; --bark-soft:#C7C7CC;
  --leaf:#34C759; --leaf-deep:#248A3D; --gold:#FFB800;
  --amber:#FF9500; --amber-soft:#FFF4E5;
  --locked:#C7C7CC; --hidden:#5856D6; --guard:#007AFF; --blue:#007AFF;
  --heat0:#FFE3B3; --heat1:#FFB340; --heat2:#FF7A1A; --heat3:#FF3B30;
  --sheet:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.07);
  --glass:rgba(255,255,255,.72);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --paper:#1C1C1E; --ink:#F5F5F7; --mute:#98989D; --line:#38383A; --fill:#2C2C2E;
    --bark:#48484A; --bark-soft:#3A3A3C;
    --leaf:#30D158; --leaf-deep:#30D158; --gold:#FFD60A;
    --amber:#FF9F0A; --amber-soft:#3A2A12;

}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",system-ui,sans-serif;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px;border-radius:10px}

.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px max(16px,calc((100% - 1240px)/2 + 20px)) 12px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.who{display:flex;align-items:center;gap:12px;flex:1 1 260px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,#5AC8FA,#007AFF);color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none}
.who h1{margin:0;font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.who p{margin:2px 0 0;color:var(--mute);font-size:14px}
.lens{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:10px;padding:2px}
.lens button{border:0;background:none;padding:6px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.lens button[aria-pressed="true"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.fake{font-size:12px;color:var(--mute)}

.stage{max-width:1240px;margin:0 auto;padding:20px 16px 32px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.treebox{position:relative;background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
svg#tree{display:block;width:100%;height:auto;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 20px 16px;font-size:13px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.events{padding:16px 20px 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.events b{font-weight:600;font-size:15px;margin-inline-end:4px}
.chip{border:0;background:var(--fill);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s}
.chip:hover{background:color-mix(in srgb,var(--blue) 12%,var(--fill))}
.chip[disabled]{opacity:.4;cursor:default}

.panel{position:sticky;top:96px;background:var(--sheet);border-radius:28px;box-shadow:var(--shadow);padding:24px;min-height:300px}
.panel h2{margin:0 0 4px;font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.panel .sub{color:var(--mute);font-size:15px;margin:0 0 14px}
.state{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.st-unlocked{background:color-mix(in srgb,var(--leaf) 14%,transparent);color:var(--leaf-deep)}
.st-mastered{background:color-mix(in srgb,var(--gold) 18%,transparent);color:#B07D00}
.st-suggested{background:var(--amber-soft);color:var(--amber)}
.st-locked{background:var(--fill);color:var(--mute)}
.st-hidden{background:color-mix(in srgb,var(--hidden) 12%,transparent);color:var(--hidden)}
.st-guard{background:color-mix(in srgb,var(--guard) 12%,transparent);color:var(--guard)}
.panel h3{font-size:13px;margin:18px 0 6px;color:var(--mute);font-weight:600}
.panel ul{margin:0;padding-inline-start:18px}
.panel li{margin:3px 0}
.conf{height:6px;background:var(--fill);border-radius:3px;overflow:hidden}
.conf i{display:block;height:100%;border-radius:3px;background:var(--amber)}
.why{background:var(--fill);border-radius:14px;padding:12px 14px;font-size:15px;margin-top:6px}
.apps{display:flex;flex-wrap:wrap;gap:8px}
.app{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:500}
.app em{font-style:normal;font-size:20px}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:600;border-radius:14px;padding:7px 14px;color:#fff;background:linear-gradient(160deg,#4CD964,#248A3D);box-shadow:0 4px 12px color-mix(in srgb,var(--leaf) 35%,transparent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{border:0;background:var(--fill);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px;color:var(--blue);transition:transform .15s,filter .15s}
.btn.primary{background:var(--blue);color:#fff}
.btn.warn{color:#FF3B30}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.empty{color:var(--mute)}
.empty strong{color:var(--ink)}

.rank{margin:8px 0 0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 4px;border-bottom:.5px solid var(--line);cursor:pointer;border-radius:8px}
.rank li:hover{background:var(--fill)}
.rank .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.rank .bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--heat3),var(--heat1))}
.rank small{color:var(--mute);font-variant-numeric:tabular-nums}
.proposal{border-radius:20px;padding:16px;margin-top:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--hidden) 10%,var(--sheet)),color-mix(in srgb,var(--blue) 8%,var(--sheet)))}
.proposal h4{margin:0 0 6px;font-weight:700;font-size:18px}
.proposal p{margin:4px 0;font-size:14px}
.kanon{font-size:13px;color:var(--mute);margin-top:12px}

.edge{fill:none;stroke:var(--bark);stroke-linecap:round}
.edge.faint{stroke:var(--bark-soft);stroke-dasharray:1 8}
.node{cursor:pointer}
.node .ring{stroke-width:2.5;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.node text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",sans-serif;fill:var(--ink)}
.node .lbl{font-size:18px;font-weight:600;paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round;letter-spacing:-.01em}
.node .ico{font-size:24px}
.node .cnt{font-size:15px;font-weight:600}
.node.sel .ring{stroke:var(--blue)!important;stroke-width:4}
.node.locked .lbl{fill:var(--mute)}
.node:hover .ring{filter:drop-shadow(0 5px 10px rgba(0,0,0,.18))}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.6;transform:scale(1.15)}}
.burst{animation:burst .9s cubic-bezier(.2,.8,.2,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes burst{from{opacity:.8;transform:scale(.7)}to{opacity:0;transform:scale(2.4)}}
.grow{animation:grow .8s ease-out}
@keyframes grow{from{opacity:0}to{opacity:1}}
.ground{fill:none}
.root{stroke:var(--bark-soft);fill:none;stroke-linecap:round}

.toast{visibility:hidden;position:fixed;inset-inline:0;bottom:24px;margin:auto;width:min(520px,calc(100% - 32px));background:rgba(29,29,31,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;border-radius:18px;padding:13px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25);font-size:15px;transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:20}
.toast.on{transform:none;visibility:visible}
.toast b{color:#FFB340}

.next{display:flex;align-items:center;gap:12px;margin:12px 20px 4px;padding:12px 16px;border-radius:16px;background:var(--amber-soft)}
.next[hidden]{display:none}
.next p{margin:0;flex:1;font-size:15px}
.next .btn{padding:7px 14px;background:var(--amber);color:#fff}
.perm{list-style:none;margin:6px 0 0;padding:0}
.perm li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:15px}
.perm small{color:var(--mute)}
.tog{position:relative;width:51px;height:31px;border:0;border-radius:999px;background:var(--fill);cursor:pointer;flex:none;font-size:0;transition:background .25s}
.tog::after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:inset-inline-end .25s}
.tog[aria-pressed="true"]{background:var(--leaf)}
.tog[aria-pressed="true"]::after{inset-inline-end:22px}
.tog[disabled]{width:auto;height:auto;font-size:12px;font-weight:600;padding:4px 10px;background:color-mix(in srgb,var(--guard) 12%,transparent);color:var(--guard);cursor:default}
.tog[disabled]::after{display:none}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;padding:16px 12px 32px}
  .panel{position:relative;top:0}
  .who h1{font-size:24px}
}
@media (max-width:600px){
  .node .lbl{font-size:25px;stroke-width:7px}
  .node .cnt{font-size:20px}
  .node .ico{font-size:28px}
  .events{padding:12px 14px 4px}
  .next{margin:10px 14px 4px}
}
@media (prefers-reduced-motion:reduce){
  .pulse,.burst,.grow{animation:none}
  .toast,.tog,.tog::after{transition:none}
}
</style>
</head>

};
// trunk anchor points (branch bases on trunk)
const T = {T820:[500,820],T770:[500,770],T640:[500,640],T560:[500,560],T460:[500,460],T400:[500,400],T300:[500,300]};

const EVENTS = [
  {id:'e1',label:'קנתה חול לחתולים',run(){ reveal('cat','נוצר ענף חדש בלייב: <b>בעלת חתול</b>. ממתין לאישור שלה.'); }},
  {id:'e2',label:'3 הזמנות סושי',run(){ reveal('sushi','עלה חדש: <b>אוהבת סושי</b>. מוצע, לא מופעל.'); }},
  {id:'e3',label:'הזמינה עגלת תינוק',run(){ guardToast(); }},
];


// what the system may learn, per category (opt-in, off = never inferred)
const PERM=[
  {k:'pets',name:'חיות מחמד',on:true,nodes:['pets','bigdog','puppy','cat']},
  {k:'food',name:'אוכל ושתייה',on:true,nodes:['food','veg','sushi']},
  {k:'move',name:'תנועה וטיולים',on:true,nodes:['bike','ride','hike']},
  {k:'home',name:'בית ומעבר דירה',on:true,nodes:['move']},
  {k:'family',name:'משפחה',on:false,fixed:'רק מה שסיפרת',nodes:[]},
  {k:'money',name:'כסף והכנסה',on:false,fixed:'רק מה שסיפרת',nodes:[]},
  {k:'health',name:'בריאות, הריון, דת, נטייה',on:false,fixed:'אף פעם לא',nodes:[]},
];
// ---------- state ----------
let lens='me', sel=null;
const svg=document.getElementById('tree'), panel=document.getElementById('panel');
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function anchor(id){ return T[id] || [N[id].x,N[id].y]; }
function permOff(id){ return PERM.some(p=>!p.on&&p.nodes.includes(id)); }
function visible(n){ const id=Object.keys(N).find(k=>N[k]===n); if(n.state==='suggested'&&permOff(id)) return false; return !(n.live && n.state==='locked' && !n.revealed); }

const STATE_TXT={unlocked:'פתוח',mastered:'שליטה מלאה',suggested:'מוצע, ממתין לאישור שלך',locked:'נעול',hidden:'מוסתר, רק את רואה',guard:'מוגן, לא מסיקים'};
const SRC_TXT={declared:'סיפרת לנו',confirmed:'הסקנו ואישרת',inferred:'הסקה של המערכת',none:'אין מידע ואין הסקה'};

function heat(c){ if(c==null) return css('--guard'); const r=c/USERS; return r>.35?css('--heat3'):r>.15?css('--heat2'):r>.05?css('--heat1'):css('--heat0'); }
function fmt(c){ return c<K?'פחות מ־'+K:c.toLocaleString('he-IL'); }

// ---------- draw ----------
function draw(){
  svg.innerHTML='';
  const crowd=lens==='crowd';
  // ground + roots
  el('ellipse',{cx:500,cy:1040,rx:330,ry:60,class:'ground'},svg);
  ['age','sex','city','lang'].forEach(k=>{const n=N[k];el('path',{d:`M500 1000 Q ${(500+n.x)/2} ${n.y-50} ${n.x} ${n.y}`,class:'root','stroke-width':crowd?6:4},svg)});
  // trunk
  el('path',{d:'M500 1010 C 488 860, 514 640, 496 470 S 504 330, 500 262',class:'edge','stroke-width':16},svg);
  // edges
  for(const [id,n] of Object.entries(N)){
    if(n.root||!n.parent||!visible(n)) continue;
    const [px,py]=anchor(n.parent);
    const w = crowd ? (n.crowd==null?3:Math.max(2.5,Math.min(18,(n.crowd/USERS)*45))) : (T[n.parent]?8:5);
    const cx=(px+n.x)/2, cy=Math.min(py,n.y)-30;
    const faint = !crowd && (n.state==='locked'||n.state==='guard');
    const p=el('path',{d:`M${px} ${py} Q ${cx} ${cy} ${n.x} ${n.y}`,class:'edge'+(faint?' faint':''),'stroke-width':faint?3:w},svg);
    if(crowd && n.crowd!=null) p.style.stroke=heat(n.crowd);
    if(n.justRevealed) p.classList.add('grow');
  }
  // nodes
  for(const [id,n] of Object.entries(N)){
    if(!visible(n)) continue;
    const g=el('g',{class:'node '+n.state+(sel===id?' sel':''),tabindex:0,role:'button','aria-label':n.name+', '+(crowd?fmt(n.crowd??0):STATE_TXT[n.state])},svg);
    g.addEventListener('click',()=>select(id));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id)}});
    const r=n.root?24:(T[n.parent]?36:30);
    if(n.justRevealed){ el('circle',{cx:n.x,cy:n.y,r:r+6,fill:'none',stroke:css('--amber'),'stroke-width':4,class:'burst'},g); }
    if(crowd){
      const c=n.crowd==null?null:n.crowd;
      const low=c!=null&&c<K;
      el('circle',{cx:n.x,cy:n.y,r,fill:low?css('--paper'):heat(c),class:'ring',stroke:low?css('--locked'):css('--paper'),'stroke-dasharray':low?'5 5':'none'},g);
      el('text',{x:n.x,y:n.y+9,'text-anchor':'middle',class:'ico'},g).textContent=n.ico;
      el('text',{x:n.x,y:n.y+r+24,'text-anchor':'middle',class:'lbl'},g).textContent=n.name;
      if(!n.root||true){ el('text',{x:n.x,y:n.y+r+44,'text-anchor':'middle',class:'cnt',fill:css('--mute')},g).textContent=c==null?'לא נאסף':fmt(c); }
      continue;
    }
    let fill=css('--fill')||css('--paper'), stroke=css('--locked'), dash='none';
    if(n.state==='unlocked'){fill=css('--leaf');stroke=css('--leaf-deep')}
    if(n.state==='mastered'){fill=css('--leaf');stroke=css('--gold')}
    if(n.state==='suggested'){fill=css('--amber-soft');stroke=css('--amber')}
    if(n.state==='hidden'){fill=css('--paper');stroke=css('--hidden');dash='2 5'}
    if(n.state==='guard'){fill=css('--paper');stroke=css('--guard')}
    if(n.state==='suggested') el('circle',{cx:n.x,cy:n.y,r:r+8,fill:'none',stroke:css('--amber'),'stroke-width':2,class:'pulse'},g);
    if(n.state==='mastered') el('circle',{cx:n.x,cy:n.y,r:r+7,fill:'none',stroke:css('--gold'),'stroke-width':3},g);
    el('circle',{cx:n.x,cy:n.y,r,fill,stroke,'stroke-dasharray':dash,class:'ring'},g);
    const ico=el('text',{x:n.x,y:n.y+9,'text-anchor':'middle',class:'ico'},g); ico.textContent=n.state==='locked'?'🔒':n.state==='hidden'?'🙈':n.ico;
    if(n.state==='locked'||n.state==='hidden') ico.setAttribute('opacity','.75');
    el('text',{x:n.x,y:n.y+r+24,'text-anchor':'middle',class:'lbl'},g).textContent=n.state==='locked'&&!n.revealed?n.name:n.name;
    if(n.state==='suggested') el('circle',{cx:n.x+r*.72,cy:n.y-r*.72,r:7,fill:css('--amber'),stroke:css('--paper'),'stroke-width':2.5},g);
  }
  for(const n of Object.values(N)) n.justRevealed=false;
  legend();
}

function legend(){
  const L=document.getElementById('legend');
  if(lens==='crowd'){
    L.innerHTML=`<span><i class="dot" style="background:var(--heat0)"></i>עד 5% מהמשתמשים</span><span><i class="dot" style="background:var(--heat1)"></i>5–15%</span><span><i class="dot" style="background:var(--heat2)"></i>15–35%</span><span><i class="dot" style="background:var(--heat3)"></i>מעל 35%</span><span><i class="dot" style="border:2px dashed var(--locked)"></i>פחות מ־${K}: מוסתר כדי לא לזהות אנשים</span><span>עובי ענף = כמה אנשים פתחו אותו</span>`;
  } else {
    L.innerHTML=`<span><i class="dot" style="background:var(--leaf)"></i>פתוח</span><span><i class="dot" style="background:var(--amber-soft);border:2px solid var(--amber)"></i>מוצע, ממתין לאישור</span><span><i class="dot" style="border:2px solid var(--locked)"></i>נעול</span><span><i class="dot" style="border:2px dashed var(--hidden)"></i>מוסתר</span><span><i class="dot" style="border:2px solid var(--guard)"></i>מוגן, לא מסיקים</span><span>השורשים = מה שסיפרת בהרשמה</span>`;
  }
}

// ---------- panel ----------
function select(id){ sel=id; draw(); lens==='crowd'?crowdPanel(id):mePanel(id); if(id&&matchMedia('(max-width:900px)').matches) panel.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'}); }

function mePanel(id){
  const n=N[id];
  if(!n){ panel.innerHTML=intro(); bindPerm(); return; }
  let h=`<span class="state st-${n.state}">${STATE_TXT[n.state]}</span><h2>${n.ico} ${n.name}</h2><p class="sub">${SRC_TXT[n.src]}</p>`;
  if(n.conf!=null && n.state!=='locked'){
    h+=`<h3>כמה אנחנו בטוחים</h3><div class="conf" role="meter" aria-valuenow="${Math.round(n.conf*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${n.conf*100}%;background:${n.state==='suggested'?'var(--amber)':'var(--leaf)'}"></i></div><small>${Math.round(n.conf*100)}%</small>`;
  }
  if(n.ev && n.state!=='locked'){ h+=`<h3>על מה זה מבוסס</h3><ul>${n.ev.map(e=>`<li>${e}</li>`).join('')}</ul>`; }
  if(n.why){ h+=`<h3>למה אני רואה את זה</h3><div class="why">${n.why}</div>`; }
  if(n.hint && n.state==='locked'){ h+=`<h3>מה פותח את זה</h3><div class="why">${n.hint}</div>`; }
  if(n.badge && (n.state==='unlocked'||n.state==='mastered')){ h+=`<h3>תג</h3><span class="badge">${n.badge}</span>`; }
  if(n.apps && n.state!=='guard'){ h+=`<h3>${n.state==='unlocked'||n.state==='mastered'?'פתוח בשבילך':'ייפתח אם תאשרי'}</h3><div class="apps">${n.apps.map(a=>`<span class="app"><em>${a[0]}</em>${a[1]}</span>`).join('')}</div>`; }
  h+=`<div class="actions">`;
  if(n.state==='suggested') h+=`<button class="btn primary" data-a="yes">כן, זו אני</button><button class="btn" data-a="no">לא נכון</button><button class="btn" data-a="hide">הסתירי</button>`;
  if(n.state==='unlocked'||n.state==='mastered') h+= n.root?'':`<button class="btn" data-a="hide">הסתירי מהפרופיל</button><button class="btn warn" data-a="forget">מחקי את הראיות</button>`;
  if(n.state==='hidden') h+=`<button class="btn" data-a="show">החזירי לפרופיל</button><button class="btn warn" data-a="forget">מחקי את הראיות</button>`;
  if(n.state==='guard') h+=`<button class="btn" data-a="tell">לספר בעצמי (אופציונלי)</button>`;
  h+=`</div>`;
  panel.innerHTML=h;
  panel.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>act(id,b.dataset.a)));
}

function act(id,a){
  const n=N[id];
  if(a==='yes'){ n.state='unlocked'; n.src='confirmed'; n.justRevealed=true; toast(`<b>${n.name}</b> נפתח. ${n.apps?'נפתחו '+n.apps.length+' מיני־אפים.':''}`); }
  if(a==='no'){ n.state='locked'; n.ev=null; n.why=null; n.hint='סימנת שזה לא נכון. לא נציע את זה שוב.'; toast('הוסר. המערכת לומדת מזה.'); }
  if(a==='hide'){ n.state='hidden'; n.why='הסתרת את הענף הזה. הוא נשאר רק אצלך ולא משמש להצעות.'; toast('הוסתר. רק את רואה אותו.'); }
  if(a==='show'){ n.state='unlocked'; n.justRevealed=true; toast('חזר לפרופיל.'); }
  if(a==='forget'){ n.state='locked'; n.ev=null; n.conf=null; n.why=null; n.hint='הראיות נמחקו. הענף ייפתח רק אם תחזרי לזה.'; toast('הראיות נמחקו.'); }
  if(a==='tell'){ toast('במוצר האמיתי: טופס קצר, הסכמה מפורשת, ומחיקה בלחיצה. כאן זה רק מוקאפ.'); return; }
  select(id); nextCard();
}

function intro(){
  const open=Object.values(N).filter(n=>!n.root&&(n.state==='unlocked'||n.state==='mastered')).length;
  const sug=Object.values(N).filter(n=>n.state==='suggested'&&visible(n)).length;
  return `<h2>העץ שלך גדל ממה שאת עושה</h2><p class="sub">בהרשמה ידענו רק גיל, מין ועיר. כל השאר צמח מהשימוש.</p>
  <p><strong>${open}</strong> ענפים פתוחים · <strong>${sug}</strong> מחכים לאישור שלך</p>
  <div class="why">שום דבר לא נכנס לפרופיל בלי שתאשרי. כל עלה מראה על מה הוא מבוסס, ואפשר להסתיר או למחוק אותו.</div>
  <h3>מה מותר למערכת ללמוד עלייך</h3><ul class="perm">${PERM.map(p=>`<li><span>${p.name}${p.fixed?`<br><small>${p.fixed}</small>`:''}</span>${p.fixed?`<button class="tog" disabled>${p.k==='health'?'חסום':'הצהרה'}</button>`:`<button class="tog" data-p="${p.k}" aria-pressed="${p.on}">${p.on?'מותר':'כבוי'}</button>`}</li>`).join('')}</ul>
  <p class="empty" style="margin-top:14px">לחצי על עלה כתום כדי לראות מה זיהינו, או נסי אירוע למעלה.</p>`;
}
function bindPerm(){ panel.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{ const p=PERM.find(x=>x.k===b.dataset.p); p.on=!p.on; toast(p.on?`<b>${p.name}</b>: מותר ללמוד. הצעות יופיעו לאישור שלך.`:`<b>${p.name}</b>: כבוי. ההצעות בתחום הוסרו ולא ייאספו.`); draw(); panel.innerHTML=intro(); bindPerm(); nextCard(); })); }
function nextCard(){
  const box=document.getElementById('next');
  const id=lens==='me'&&Object.keys(N).find(k=>N[k].state==='suggested'&&visible(N[k]));
  if(!id){ box.hidden=true; return; }
  const n=N[id]; box.hidden=false;
  box.innerHTML=`<p><strong>הצעד הבא:</strong> נראה לנו ש${n.q||n.name}. נכון?</p><button class="btn primary" id="nx">לבדוק</button>`;
  document.getElementById('nx').onclick=()=>select(id);
}

// ---------- crowd lens ----------
function signal(n){
  const share=(n.crowd||0)/USERS, growth=n.growth||0, weight=n.weight||1;
  return Math.round(Math.min(100,(share*120+growth*.9)*weight));
}
Object.assign(N.pets,{growth:22,weight:1.1});Object.assign(N.bigdog,{growth:38,weight:1.2});
Object.assign(N.move,{growth:61,weight:1.3});Object.assign(N.veg,{growth:14,weight:1});
Object.assign(N.family,{growth:6,weight:1.3});Object.assign(N.food,{growth:4,weight:.8});
Object.assign(N.puppy,{growth:45,weight:1});Object.assign(N.hike,{growth:19,weight:1});
Object.assign(N.cat,{growth:300,weight:1});Object.assign(N.sushi,{growth:9,weight:.7});Object.assign(N.bike,{growth:11,weight:1});Object.assign(N.hobby,{growth:3,weight:.5});Object.assign(N.home,{growth:5,weight:1});Object.assign(N.gan,{growth:8,weight:1});Object.assign(N.school,{growth:7,weight:1});Object.assign(N.photo,{growth:12,weight:1});Object.assign(N.ride,{growth:20,weight:1});

function crowdPanel(id){
  const list=Object.entries(N).filter(([k,n])=>!n.root&&n.crowd!=null&&visible(n)).map(([k,n])=>({k,n,s:signal(n)})).sort((a,b)=>b.s-a.s);
  const top=list.filter(x=>x.n.crowd>=100)[0];
  const max=list[0].s||1;
  let h=`<h2>איפה העץ נדלק</h2><p class="sub">${USERS.toLocaleString('he-IL')} משתמשים בדויים. נספרים רק ענפים שאנשים אישרו, ורק כסכומים. אף אדם לא מזוהה.</p>`;
  if(id && N[id] && !N[id].root){
    const n=N[id];
    h+=`<div class="why"><strong>${n.ico} ${n.name}</strong><br>${n.crowd==null?'קטגוריה מוגנת. לא אוספים ולא סופרים.':n.crowd<K?`פחות מ־${K} אנשים. לא מציגים מספר, כדי שאי אפשר יהיה לזהות אף אחד.`:`${fmt(n.crowd)} אנשים · צמיחה ${n.growth||0}% ברבעון · ציון ${signal(n)}`}</div>`;
  }
  h+=`<h3>ענפים לפי ציון ביקוש</h3><ul class="rank">`;
  for(const x of list.slice(0,7)){
    h+=`<li data-k="${x.k}"><span>${x.n.ico} ${x.n.name}</span><small>${x.n.crowd<K?'מוסתר':x.s}</small><span class="bar"><i style="width:${x.n.crowd<K?0:x.s/max*100}%"></i></span></li>`;
  }
  h+=`</ul>`;
  if(top){
    h+=`<div class="proposal"><h4>🤖 הצעה לסוכן: ${top.n.name}</h4>
      <p>${fmt(top.n.crowd)} אנשים, צמיחה ${top.n.growth}% ברבעון. יש רק ${top.n.apps?top.n.apps.length:0} מיני־אפים בענף, כלומר ביקוש בלי היצע.</p>
      <p>סוכן יבנה טיוטה של מיני־אפ חדש לענף, תקציב מוגבל, ושום דבר לא עולה לאוויר בלי אישור של אדמין.</p>
      <div class="actions"><button class="btn primary" id="approve">אשר לסוכן לבנות טיוטה</button></div></div>`;
  }
  h+=`<p class="kanon">ענף עם פחות מ־${K} אנשים לא מוצג במספרים. סוכן מוצע רק מעל 100. קטגוריות רגישות לא נאספות בכלל.</p>`;
  panel.innerHTML=h;
  panel.querySelectorAll('.rank li').forEach(li=>li.addEventListener('click',()=>select(li.dataset.k)));
  const ap=document.getElementById('approve'); if(ap) ap.addEventListener('click',()=>toast(`במוקאפ: הסוכן היה מתחיל טיוטה ל־<b>${top.n.name}</b> ומחזיר אותה לאישור. בפועל לא קורה כלום.`));
}

// ---------- events ----------
function reveal(id,msg){ const n=N[id]; if(permOff(id)){ toast('הקטגוריה כבויה אצלה. לא לומדים מזה.'); return; } n.revealed=true; n.state='suggested'; n.justRevealed=true; toast(msg); select(id); nextCard(); }
function guardToast(){ toast('<b>עצרנו.</b> עגלת תינוק יכולה לרמוז על הריון, וזה מידע רגיש. לא מסיקים. מציעים לה לבחור בעצמה אם לפתוח ענף.'); select('health'); }
const evBox=document.getElementById('events');
for(const e of EVENTS){ const b=document.createElement('button'); b.className='chip'; b.textContent=e.label; b.addEventListener('click',()=>{ if(lens!=='me') setLens('me'); e.run(); b.disabled=true; }); evBox.appendChild(b); }

let tt; function toast(h){ const t=document.getElementById('toast'); t.innerHTML=h; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),4200); }

function setLens(l){
  lens=l;
  document.getElementById('lensMe').setAttribute('aria-pressed',l==='me');
  document.getElementById('lensCrowd').setAttribute('aria-pressed',l==='crowd');
  document.getElementById('title').textContent=l==='me'?'העץ של נועה':'העץ של כולם';
  document.getElementById('subtitle').textContent=l==='me'?'34 · תל אביב · נרשמה לפני 5 חודשים':'אותו עץ, דרך עיני האדמין';
  sel=null; draw(); l==='me'?(panel.innerHTML=intro(),bindPerm()):crowdPanel(null); nextCard();
}
document.getElementById('lensMe').addEventListener('click',()=>setLens('me'));
document.getElementById('lensCrowd').addEventListener('click',()=>setLens('crowd'));
const q=new URLSearchParams(location.search);
setLens(q.get('lens')==='crowd'?'crowd':'me');
if(q.get('sel')) select(q.get('sel'));
</script>
