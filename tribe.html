<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>השבט של נועה</title>
<meta name="description" content="מוקאפ: שבט שעוזר. הצרכים של נועה באמצע, חברים סביב, וקישורים זמניים שנוצרים לעזרה אחת ומתפוגגים. נתונים מומצאים בלבד.">
<!-- icons: truck blocks dog hammer salad landmark lock check car dumbbell wrench chef-hat leaf cake camera activity smartphone message-circle hand-heart users-round sparkles eye-off clock link-2 x rotate-ccw -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --sheet:#FFFFFF; --ink:#1D1D1F; --mute:#6E6E73; --line:#E5E5EA; --fill:#F2F2F7; --blue:#007AFF; --amber:#C77700;
  --glass:rgba(255,255,255,.72); --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.07);
  --space:#0B0B10; --space2:#17171F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000; --sheet:#1C1C1E; --ink:#F5F5F7; --mute:#98989D; --line:#38383A; --fill:#2C2C2E; --blue:#0A84FF; --amber:#FFB340; --glass:rgba(28,28,30,.72); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); }
}
:root[data-theme="dark"]{ --bg:#000; --sheet:#1C1C1E; --ink:#F5F5F7; --mute:#98989D; --line:#38383A; --fill:#2C2C2E; --blue:#0A84FF; --amber:#FFB340; --glass:rgba(28,28,30,.72); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5); }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",system-ui,sans-serif;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px;border-radius:10px}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px max(16px,calc((100% - 1240px)/2 + 20px)) 12px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top h1{margin:0;font-weight:700;font-size:26px;letter-spacing:-.02em;flex:1 1 220px}
.top h1 small{display:block;font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0}
.seg{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:10px;padding:2px}
.seg a{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.seg [aria-current="page"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 32px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}

/* canvas */
.canvas{position:relative;border-radius:28px;overflow:hidden;color:#F5F5F7;background:radial-gradient(120% 90% at 50% 48%,var(--space2) 0%,var(--space) 62%);box-shadow:0 20px 60px rgba(0,0,0,.18)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:18px 22px 0}
.play{height:44px;border-radius:22px;border:0;background:#fff;color:#000;display:flex;align-items:center;gap:8px;padding:0 18px 0 14px;cursor:pointer;flex:none;font-weight:600;font-size:15px}
.play svg{width:16px;height:16px}
.play .sm{display:none}
@media (max-width:600px){ .play .sm{display:inline} }
.days{display:flex;gap:4px;direction:rtl}
.days span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.38);background:rgba(255,255,255,.05);transition:background .4s,color .4s}
.days span.on{background:rgba(255,255,255,.92);color:#000}
.days span.past{color:rgba(255,255,255,.7);background:rgba(255,255,255,.12)}
.tally{margin-inline-start:auto;text-align:end;line-height:1.2}
.tally b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tally b em{font-style:normal;display:inline-block;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.tally b em.bump{transform:scale(1.35)}
.tally small{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11.5px;color:rgba(255,255,255,.45)}
svg#viz{display:block;width:100%;height:auto;max-height:max(420px,calc(100vh - 330px));margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dock{min-height:92px;padding:0 18px 18px;display:flex;align-items:flex-end;justify-content:center}
.hint{font-size:14px;color:rgba(255,255,255,.55);text-align:center;max-width:560px;margin:0 auto 6px;transition:opacity .3s}
.card{width:min(100%,520px);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;border-radius:20px;background:rgba(44,44,46,.82);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:.5px solid rgba(255,255,255,.12);box-shadow:0 12px 40px rgba(0,0,0,.45);animation:rise .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.card .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;background:#3A3A3C;grid-row:span 2}
.card .who{font-weight:700;font-size:16px}
.card .what{font-size:13.5px;color:rgba(255,255,255,.7);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.card .what span{display:inline-flex;align-items:center;gap:4px}
.card .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.card .acts button{flex:1;height:40px;border-radius:12px;border:0;font-weight:600;font-size:15px;cursor:pointer}
.card .ok{background:#0A84FF;color:#fff}
.card .no{background:rgba(255,255,255,.1);color:#fff}
.card .acts button.press{transform:scale(.95);filter:brightness(1.25);transition:transform .12s,filter .12s}
.card .fine{grid-column:1/-1;font-size:12px;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:5px}
.cap{display:none;position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:15px;color:rgba(255,255,255,.5)}

/* svg nodes */
.n{cursor:pointer;outline:none}
.n text,.lk text,.bub text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo",sans-serif}
.lbl{font-weight:600;fill:rgba(255,255,255,.92);paint-order:stroke;stroke:#0E0E14;stroke-linejoin:round}
.sub{font-weight:500;fill:rgba(255,255,255,.55);paint-order:stroke;stroke:#0E0E14;stroke-linejoin:round;font-variant-numeric:tabular-nums}
.n:focus-visible .ring{stroke:#fff;stroke-opacity:1}
.bub{cursor:pointer}
.orbit{fill:none;stroke:rgba(255,255,255,.07);stroke-dasharray:2 7}

/* panel */
.panel{background:var(--sheet);border-radius:28px;box-shadow:var(--shadow);padding:22px}
.panel h2{margin:0 0 2px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.panel .lead{margin:0 0 12px;color:var(--mute);font-size:14px}
.panel h3{font-size:13px;margin:18px 0 6px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:6px}
.panel h3 .ct{font-weight:500;color:var(--mute);margin-inline-start:auto;font-variant-numeric:tabular-nums}
.priv{display:grid;grid-template-columns:auto 1fr;gap:8px;background:var(--fill);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--ink)}
.priv .i{width:18px;height:18px;color:var(--mute);margin-top:1px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--line);font-size:15px}
.rows li:last-child{border-bottom:0}
.rows li small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3}
.rows li.sel{background:color-mix(in srgb,var(--blue) 8%,transparent);border-radius:10px;margin:0 -8px;padding:8px}
.rows li.done{opacity:.55}
.tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;border:1.5px solid var(--h);color:var(--h);background:color-mix(in srgb,var(--h) 12%,transparent)}
.tile.full{background:var(--h);color:#fff;border-color:transparent}
.tile.av{border-radius:50%;background:var(--fill);border:0;color:var(--ink);font-weight:700;font-size:14px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:0;background:var(--line);cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:#30D158}
.sw[aria-checked="true"]::after{transform:translateX(-18px)}
.swl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--fill);color:var(--mute);margin-inline-start:4px;vertical-align:1px}
.tag.s2{background:color-mix(in srgb,#FF375F 14%,transparent);color:#D70035}
.tag .i{width:11px;height:11px}
.btn{border:0;border-radius:10px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:default}
.cd{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12.5px}
.meter{grid-column:2/-1;height:3px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:2px;background:var(--h);transform-origin:right}
.tl{list-style:none;margin:0;padding:0 0 0 0;position:relative}
.tl li{position:relative;padding:4px 18px 8px 0;font-size:14px}
.tl li::before{content:"";position:absolute;right:4px;top:12px;bottom:-4px;width:1.5px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;right:0;top:8px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--h)}
.tl li small{display:block;color:var(--mute);font-size:12px}
.empty{font-size:13.5px;color:var(--mute);padding:4px 0}
.fcard{background:var(--fill);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.fcard .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fcard .hd b{font-size:17px}
.fcard .x{margin-inline-start:auto;border:0;background:none;cursor:pointer;color:var(--mute);padding:4px;font-size:18px;display:grid}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--h) 16%,transparent)}
.chip .i{color:var(--h)}
.chip small{color:var(--mute);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}

body.video .top,body.video .panel{display:none}
body.video .wrap{display:block;padding:0;max-width:none}
body.video .canvas{position:relative;top:0;border-radius:0;box-shadow:none;min-height:100vh;display:flex;flex-direction:column}
body.video .ctl{padding:26px 36px 0}
body.video svg#viz{height:calc(100vh - 210px);max-height:none;width:auto;margin:0 auto;flex:none}
body.video .dock{min-height:100px;padding-bottom:46px}
body.video .cap{display:block}
@media (min-width:901px){ .canvas{position:sticky;top:84px} }
@media (max-width:900px){ .wrap{grid-template-columns:1fr;padding:16px 12px 32px} }
@media (max-width:600px){
  svg#viz{max-height:none} .play .lg{display:none} .ctl{flex-wrap:wrap} .days{margin-inline-start:auto}
  .top h1{font-size:22px} .seg a{padding:6px 10px;font-size:13px}
  .ctl{padding:14px 14px 0;gap:10px} .play{height:40px;padding:0 14px 0 12px;font-size:14px}
  .days span{width:26px;height:26px;font-size:12px} .days{gap:3px}
  .tally{flex:1 1 100%;text-align:start;display:flex;align-items:baseline;gap:8px} .tally small{justify-content:flex-start}
  .dock{padding:0 12px 14px;min-height:80px} .hint{font-size:13px}
  .panel{padding:18px;border-radius:24px}
}
@media (prefers-reduced-motion:reduce){ .card{animation:none} .tally b em{transition:none} }
</style>
</head>

  <h1>השבט של נועה<small>שבט שעוזר: קישורים זמניים לעזרה, בלי היררכיה</small></h1>
  <nav class="seg" aria-label="עמודים"><a href="index.html">העץ של נועה</a><a href="age.html">לפי גיל</a><a aria-current="page" href="tribe.html">השבט</a></nav>
</header>

      <div class="days" id="days" aria-hidden="true"><span>א</span><span>ב</span><span>ג</span><span>ד</span><span>ה</span><span>ו</span><span>ש</span></div>

    <svg id="viz" viewBox="0 0 1000 1000" role="group" aria-label="נועה במרכז, הצרכים שלה סביבה, והחברים בטבעת החיצונית"></svg>
    <div class="dock" id="dock"></div>
    <div class="cap">עץ יכולות · שבט שעוזר · רק מה שבחרו לשתף · קישורים זמניים · נתונים מומצאים</div>
  </section>
  <aside class="panel" id="panel"></aside>
</main>

let lastT={gave:0,got:0};
function renderTally(){ const t=document.getElementById('tally'); t.innerHTML=`עזרתי <em>${tally.gave}</em> · קיבלתי <em>${tally.got}</em>`;
  const ems=t.querySelectorAll('em'); if(tally.gave!==lastT.gave) pop(ems[0]); if(tally.got!==lastT.got) pop(ems[1]); lastT={...tally};
  document.getElementById('tallyNote').innerHTML=`${icon('eye-off')} השבוע · רק את רואה`; }
function pop(e){ e.classList.add('bump'); setTimeout(()=>e.classList.remove('bump'),360); }
function bump(){}

// ---- panel ----
function renderPanel(){
  let h=`<h2>השבט שלי</h2><p class="lead">${FRIENDS.length} חברים · עוזרים זה לזה בלי היררכיה</p>`;
  h+=`<div class="priv">${icon('eye-off')}<div>רק מה שבחרת לשתף גלוי לשבט, ורק הענפים שאישרת. קישורים זמניים: נפתחים לעזרה אחת ומתפוגגים. מידע משפחתי וכספי (S2) ובריאות (S3) לא משותפים כברירת מחדל. אף אחד לא סופר בפומבי.</div></div>`;
  if(selFriend){ const f=FR[selFriend], nd=f.needs[0], busy=links.some(l=>l.need===nd);
    h+=`<h3>${f.g==='f'?'מה שהיא בחרה לשתף':'מה שהוא בחר לשתף'}</h3><div class="fcard"><div class="hd"><span class="tile av">${f.name[0]}</span><b>${esc(f.name)}, ${f.age}</b><button class="x" data-close aria-label="סגור">${icon('x')}</button></div>
      <div class="chips">${f.offers.map(o=>{const O=OFFERS[o], s2=trTier(O.t)==='S2'; return `<span class="chip" style="--h:${hueOf(O.t)}">${icon(O.icon)}${esc(O.he)} <small>· ${esc(trName(O.t))}${s2?' · שותף במפורש':''}</small></span>`;}).join('')}</div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px;font-size:14px"><span class="tile" style="--h:${AMBER};width:26px;height:26px;font-size:14px">${icon(nd.icon)}</span><span style="flex:1">${f.g==='f'?'צריכה':'צריך'}: ${esc(nd.he)}<small style="display:block;color:var(--mute);font-size:12px">${esc(nd.when)}</small></span>
      <button class="btn" data-help="${f.id}" ${resolved[nd.id]||busy?'disabled':''}>${resolved[nd.id]?'נעזר':busy?'בתהליך':'אני יכולה לעזור'}</button></div></div>`; }
  // my needs
  h+=`<h3>הצרכים שלי<span class="ct">${NEEDS.filter(n=>n.shared).length} משותפים · ${NEEDS.filter(n=>!n.shared).length} פרטי</span></h3><ul class="rows">`;
  NEEDS.forEach(n=>{ const s2=trTier(n.t)==='S2', done=resolved[n.id];
    h+=`<li class="${selNeed===n.id?'sel':''} ${done?'done':''}"><span class="tile" style="--h:${n.shared?hueOf(n.t):'#8E8E93'}">${icon(n.icon)}</span>
      <span><button data-sel="${n.id}" style="border:0;background:none;padding:0;cursor:pointer;text-align:start;font-size:15px">${esc(n.he)}</button>${s2?`<span class="tag s2">${icon('lock')}S2</span>`:''}<small>${done?`נפתר ${esc(done.day)}`:n.shared?`${esc(n.when)} · גלוי לשבט`:'פרטי · רק אני רואה'}${s2?(n.shared?' · שותף במפורש':' · שיתוף רק בהסכמה מפורשת'):''}</small></span>
      <span class="swl"><button class="sw" role="switch" aria-checked="${n.shared}" aria-label="שיתוף עם השבט: ${esc(n.he)}" data-tog="${n.id}"></button></span></li>`; });
  h+=`</ul>`;
  // reverse: friends' needs I can help with
  const open=FRIENDS.filter(f=>!resolved[f.needs[0].id]&&ME.offers.includes(f.needs[0].fits));
  h+=`<h3>אני יכולה לעזור<span class="ct">${open.length}</span></h3><ul class="rows">${open.map(f=>{ const nd=f.needs[0], busy=links.some(l=>l.need===nd);
    return `<li><span class="tile av">${f.name[0]}</span><span>${esc(nd.he)}<small>${esc(f.name)} · ${esc(nd.when)} · בזכות ${esc(OFFERS[nd.fits].he)}</small></span><button class="btn" data-help="${f.id}" ${busy?'disabled':''}>${busy?'בתהליך':'אעזור'}</button></li>`; }).join('')||'<li class="empty">כל הצרכים שאת יכולה לעזור בהם נפתרו</li>'}</ul>`;
  // active links
  const act=links.filter(l=>l.state!=='dissolve');
  h+=`<h3>${icon('link-2')} קישורים פעילים<span class="ct">${act.length}</span></h3>`;
  h+=act.length?`<ul class="rows">${act.map(l=>{ const f=FR[l.friend];
    return `<li><span class="tile full" style="--h:${l.hue}">${icon(l.need.icon)}</span><span>${l.kind==='in'?`${esc(f.name)} ← אני`:`אני ← ${esc(f.name)}`} · ${esc(l.need.he)}<small>${esc(l.need.when)} · <span class="cd" data-cd="${l.id}">${l.state==='pending'?'מחכה לאישור':''}</span></small></span><span></span><span class="meter" style="--h:${l.hue}"><i data-meter="${l.id}"></i></span></li>`; }).join('')}</ul>`:`<p class="empty">אין קישורים פתוחים. קישור נוצר רק לעזרה אחת ונעלם אחריה.</p>`;
  // history
  h+=`<h3>היסטוריה</h3><ul class="tl">${history.slice(0,8).map(x=>`<li style="--h:${x.dir==='consent'?'#FF375F':x.dir==='in'?hueOf(x.t):AMBER}">${esc(x.text)}<small>${x.dir==='consent'?'יומן הסכמות':x.dir==='in'?'קיבלתי':'עזרתי'} · ${esc(x.when)}</small></li>`).join('')}</ul>`;
  h+=`<div class="legend"><span><i style="background:#30D158"></i>מלא = מה שמציעים</span><span><i style="border:2px solid ${AMBER}"></i>חלול = צורך</span><span>${icon('lock')}פרטי</span><span>${icon('link-2')}קישור זמני</span></div>`;
  panel.innerHTML=h;
  panel.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{ stopSim(); toggleShare(b.dataset.tog); });
  panel.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{ stopSim(); selectNeed(b.dataset.sel); });
  panel.querySelectorAll('[data-help]').forEach(b=>b.onclick=()=>{ stopSim(); helpFriend(b.dataset.help); });
  panel.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ selFriend=null; sync(); });
}
function updateCountdowns(now){ links.forEach(l=>{ if(l.state!=='active') return; const left=l.dur-(now-l.t0);
  const c=panel.querySelector(`[data-cd="${l.id}"]`); if(c) c.textContent='מתפוגג בעוד '+fmt(left);
  const m=panel.querySelector(`[data-meter="${l.id}"]`); if(m) m.style.transform=`scaleX(${Math.max(0,left/l.dur).toFixed(3)})`; }); }
function sync(){ renderDock(); renderPanel(); }

// ---- "simulate a week" (scripted, uses the same actions a person would) ----
let sim=null;
function setDay(i){ dayIdx=i; document.querySelectorAll('#days span').forEach((s,j)=>{ s.classList.toggle('on',j===i); s.classList.toggle('past',j<i); }); }
function press(){ const b=document.getElementById('ok'); if(b) b.classList.add('press'); }
function resetAll(){ links.forEach(l=>{l.v.g.remove(); l.v.tg.remove();}); links=[]; pending=null; selNeed=null; selFriend=null; hintOverride=null;
  for(const k in resolved) delete resolved[k]; tally.gave=0; tally.got=0; lastT={gave:0,got:0}; { const keep=history.filter(x=>x.seed||x.dir==='consent'); history.splice(0,history.length,...keep); } setDay(-1); renderTally(); sync(); }
function startSim(scale){
  stopSim(); resetAll(); scale=scale||(+qp.get('speed')||1); const S=ms=>ms*scale;
  sim={timers:[],ttl:S(4200)};
  const at=(ms,fn)=>sim.timers.push(setTimeout(()=>{ try{fn();}catch(e){console.error(e);} },S(ms)));
  const steps=[
    [0,()=>setDay(0)],
    [500,()=>selectNeed('veg')],
    [2100,()=>takeOffer('maya')],
    [3300,press],[3500,confirmPending],
    [4400,()=>setDay(1)],
    [4900,()=>{ hintOverride=`${icon('sparkles')} יואב צריך טרמפ למוסך. לך יש רכב.`; selFriend='yoav'; sync(); }],
    [6000,()=>helpFriend('yoav')],
    [7100,press],[7300,confirmPending],
    [8500,()=>setDay(2)],
    [9000,()=>{ hintOverride=`${icon('sparkles')} מאיה צריכה עוגה ליום הולדת. את אופה.`; selFriend='maya'; sync(); }],
    [10000,()=>helpFriend('maya')],
    [11000,press],[11200,confirmPending],
    [12500,()=>setDay(3)],
    [13000,()=>setDay(4)],
    [13400,()=>{ hintOverride=`${icon('sparkles')} אבי צריך עזרה עם וואטסאפ.`; selFriend='avi'; sync(); }],
    [14300,()=>helpFriend('avi')],
    [15300,press],[15500,confirmPending],
    [17000,()=>setDay(5)],
    [17600,()=>selectNeed('furn')],
    [19300,()=>takeOffer('yoav')],
    [20500,press],[20700,confirmPending],
    [21800,()=>setDay(6)],
    [27200,()=>{ hintOverride=`${icon('hand-heart')} שבוע של עזרה הדדית. כולם הרוויחו, ואף אחד לא סופר בפומבי.`; selFriend=null; selNeed=null; sync(); }],
    [28600,()=>{ document.getElementById('play').classList.remove('on'); setPlayIcon(false); sim=null; }],
  ];
  steps.forEach(([t,fn])=>at(t,fn)); setPlayIcon(true);
}
function stopSim(){ if(!sim) return; sim.timers.forEach(clearTimeout); sim=null; hintOverride=null; setPlayIcon(false); }
function setPlayIcon(on){ document.getElementById('play').innerHTML=on?'<svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/></svg><span>עצירה</span>':'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg><span class="lg">הדמיית שבוע</span><span class="sm">הדמיה</span>'; }
document.getElementById('play').addEventListener('click',()=>sim?stopSim():startSim());

// ---- boot ----
if(qp.get('video')) document.body.classList.add('video');
let rz=null; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ geo(); measure(); },120); });
measure(); renderTally(); sync(); requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(measure);
if(qp.get('need')) selectNeed(qp.get('need'));
if(qp.get('play')) setTimeout(()=>startSim(), +qp.get('delay')||800);
window.__tribe={selectNeed,takeOffer,helpFriend,confirmPending,cancel,toggleShare,startSim,stopSim,state:()=>({selNeed,selFriend,pending:!!pending,links:links.map(l=>l.state),tally:{...tally}})};
</script>
</body>
</html>
